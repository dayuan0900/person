<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani - Final Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; user-select: none; }
        
        #ui {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(12, 10, 8, 0.95);
            border: 1px solid rgba(255,180,0,0.3);
            border-radius: 12px;
            padding: 15px; color: #fff; z-index: 100;
            box-shadow: 0 10px 60px rgba(0,0,0,0.9);
            max-height: 90vh; overflow-y: auto;
            display: none;
        }
        
        #ui::-webkit-scrollbar { width: 4px; }
        #ui::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

        h3 { 
            margin: 0 0 12px 0; color: #ffb700; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,183,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
        }

        .control { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #ccc; margin-bottom: 4px; }
        
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ffb700; height: 3px; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }
        input[type="color"] { width: 100%; height: 25px; border: none; padding: 0; background: none; cursor: pointer; }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 4px;
            background: linear-gradient(135deg, #ffb700, #ff6f00);
            color: #000; font-weight: bold; cursor: pointer;
            margin-top: 5px; font-size: 12px;
        }
        .btn:hover { filter: brightness(1.2); }

        .hint { font-size: 9px; color: #666; text-align: center; margin-top: 10px; }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #ffb700;
            font-size: 12px; letter-spacing: 2px; transition: opacity 0.5s;
        }
        #error-msg { color: #f00; margin-top: 10px; font-size: 10px; max-width: 80%; text-align: center; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="loading">
    <div>SYSTEM STARTING...</div>
    <div id="error-msg"></div>
</div>

<div id="ui">
    <div id="btnClose" style="position:absolute; top:10px; right:15px; cursor:pointer; color:#666;">×</div>

    <h3>GALAXY CONTROL</h3>
    
    <div class="control">
        <label>UPLOAD / 上传法相</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
        <button class="btn" id="btnGen">ACTIVATE / 显现</button>
    </div>

    <!-- 法相参数 -->
    <div class="control">
        <label>SIZE / 大小</label>
        <input type="range" id="imgScale" min="0.5" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="control">
        <label>HEIGHT / 高度</label>
        <input type="range" id="textHeight" min="-5" max="10" value="2" step="0.5">
    </div>
    <div class="control">
        <label>SOLIDITY / 填充度 (消黑点)</label>
        <input type="range" id="pSizeRange" min="0.05" max="0.30" step="0.01" value="0.12">
    </div>
    <div class="control">
        <label>BRIGHTNESS / 亮度</label>
        <input type="range" id="brightnessRange" min="5" max="30" value="10">
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;"></div>

    <!-- 星系参数 -->
    <div class="control">
        <label>GALAXY SIZE / 扩散范围</label>
        <input type="range" id="galRadius" min="10" max="80" value="30">
    </div>
    <div class="control">
        <label>GALAXY THICKNESS / 中间厚度</label>
        <input type="range" id="galThick" min="0" max="50" value="25">
    </div>
    <div class="control">
        <label>GALAXY MIST / 雾化程度</label>
        <input type="range" id="galRandom" min="0" max="30" value="5">
    </div>
