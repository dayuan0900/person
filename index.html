<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani - HD Portrait (Rescue)</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', monospace; user-select: none; 
        }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #ffca28;
            font-size: 12px; letter-spacing: 2px; transition: opacity 0.5s;
        }
        
        #error-log {
            color: #ff5555; font-size: 10px; margin-top: 10px; 
            max-width: 80%; text-align: center;
        }

        #ui {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(15, 15, 20, 0.9);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 15px; color: #fff; z-index: 100;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
            display: none; /* 加载完再显示 */
        }

        h3 { 
            margin: 0 0 10px 0; color: #ffca28; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255,160,0,0.5);
        }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 4px;
            background: linear-gradient(135deg, #ffca28, #ff6f00);
            color: #000; font-weight: bold; cursor: pointer;
            margin-top: 5px; font-size: 12px; letter-spacing: 1px;
        }
        .btn:hover { filter: brightness(1.2); }

        .control { margin-bottom: 10px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #ccc; margin-bottom: 3px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ffd700; height: 2px; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }
        input[type="color"] { width: 100%; height: 25px; border: none; padding: 0; background: none; }

        .hint { font-size: 9px; color: #666; text-align: center; margin-top: 8px; }
        canvas { display: block; }
    </style>

    <!-- 1. 错误捕获脚本 (最先运行) -->
    <script>
        window.onerror = function(msg, url, line) {
            const el = document.getElementById('error-log');
            if(el) el.innerText = "ERROR: " + msg + " (Line " + line + ")";
        };
    </script>
    
    <!-- 2. 更稳健的 Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="loading">
    <div>INITIALIZING HD ENGINE...</div>
    <div id="error-log"></div>
</div>

<div id="ui">
    <div onclick="document.getElementById('ui').style.opacity = '0'" style="position:absolute; top:10px; right:15px; cursor:pointer; color:#666;">×</div>

    <h3>HD PORTRAIT GALAXY</h3>
    
    <div class="control">
        <label>UPLOAD PHOTO / 上传照片 (PNG推荐)</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
        <button class="btn" id="btnGen">ACTIVATE / 显现</button>
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:12px 0;"></div>

    <div class="control">
        <label>IMAGE DETAIL / 清晰度 (拉大最清晰)</label>
        <input type="range" id="densityRange" min="1" max="5" step="1" value="4" oninput="processSourceWithCache()">
    </div>

    <div class="control">
        <label>PARTICLE SIZE / 粒子大小 (拉小最细腻)</label>
        <input type="range" id="pSizeRange" min="0.01" max="0.15" step="0.01" value="0.04" oninput="updateMaterial()">
    </div>

    <div class="control">
        <label>BRIGHTNESS / 亮度 (防止过曝)</label>
        <input type="range" id="brightnessRange" min="5" max="30" value="12" oninput="updateColors()">
    </div>

    <div class="control">
        <label>IMAGE HEIGHT / 悬浮高度</label>
        <input type="range" id="textHeight" min="-5" max="10" value="2" step="0.5">
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:12px 0;"></div>

    <div class="control">
        <label>GALAXY COLOR / 星系颜色</label>
        <input type="color" id="colorInside" value="#ff6030" oninput="updateGalaxy()">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏界面</div>
</div>

<!-- 3. 核心脚本 (data-cfasync="false" 防止 Cloudflare 干扰) -->
<script type="module" data-cfasync="false">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- 启动检查 ---
    const loadingEl = document.getElementById('loading');
    const uiEl = document.getElementById('ui');
    
    // --- 1. 场景初始化 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ReinhardToneMapping;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0;
    bloomPass.strength = 0.8;
    bloomPass.radius = 0.3;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- 2. 变量 ---
    let galaxyPoints = null;
    let imgPoints = null;
    let imgGeometry = null;
    let imgMaterial = null;
    
    let cachedImg = null;
    let originalColors = [];

    const parameters = {
        count: 60000, 
        radius: 30,
        branches: 3,
        insideColor: '#ff6030',
        outsideColor: '#1b3984'
    };

    // --- 3. 星系背景 ---
    function generateGalaxy() {
        if (galaxyPoints) {
            scene.remove(galaxyPoints);
            galaxyPoints.geometry.dispose();
            galaxyPoints.material.dispose();
        }

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(parameters.count * 3);
        const colors = new Float32Array(parameters.count * 3);
        const cIn = new THREE.Color(parameters.insideColor);
        const cOut = new THREE.Color(parameters.outsideColor);

        for (let i = 0; i < parameters.count; i++) {
            const i3 = i * 3;
            const r = Math.random() * parameters.radius;
            const spin = r * 1;
            const branch = (i % parameters.branches) / parameters.branches * Math.PI * 2;
            
            const randomX = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * 0.2 * r;
            const randomY = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * 0.2 * r;
            const randomZ = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * 0.2 * r;

            positions[i3] = Math.cos(branch + spin) * r + randomX;
            positions[i3+1] = randomY * 1.5;
            positions[i3+2] = Math.sin(branch + spin) * r + randomZ;

            const mixedColor = cIn.clone();
            mixedColor.lerp(cOut, r / parameters.radius);
            colors[i3] = mixedColor.r; colors[i3+1] = mixedColor.g; colors[i3+2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.03,
            sizeAttenuation: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true
        });

        galaxyPoints = new THREE.Points(geometry, material);
        scene.add(galaxyPoints);
    }

    // --- 4. 高清影像引擎 ---
    
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="1000" height="1000" ');
        }
        return svg;
    }

    function processSource(src) {
        // 无需 setStatus，直接控制台
        console.log("Loading image...");
        const img = new Image();
        img.onload = () => {
            cachedImg = img;
            processSourceWithCache();
        };
        img.onerror = () => alert("加载失败，请检查文件");
        img.src = src;
    }

    window.processSourceWithCache = function() {
        if (!cachedImg) return;
        
        const density = parseInt(document.getElementById('densityRange').value);
        const w = 400 + (density * 200); 
        const h = w; 

        const canvas2d = document.createElement('canvas');
        canvas2d.width = w; canvas2d.height = h;
        const ctx2d = canvas2d.getContext('2d');
        
        ctx2d.clearRect(0, 0, w, h);
        
        const aspect = cachedImg.width / cachedImg.height || 1;
        let dw = w, dh = w/aspect;
        if(dh > h) { dh = h; dw = h*aspect; }
        
        ctx2d.drawImage(cachedImg, (w-dw)/2, (h-dh)/2, dw, dh);
        
        const data = ctx2d.getImageData(0,0,w,h).data;
        const points = [];
        const colors = [];
        const gap = 1; 

        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                if (a > 20) {
                    points.push({
                        x: (x / w - 0.5) * 15, 
                        y: -(y / h - 0.5) * 15 * (h/w), 
                        z: 0 
                    });
                    colors.push({ r: r/255, g: g/255, b: b/255 });
                }
            }
        }
        
        if(points.length > 0) createImgParticles(points, colors);
        else alert("无内容！请确保图片不是全透明的。");
    };

    function createImgParticles(points, colorData) {
        if (imgPoints !== null) {
            imgGeometry.dispose();
            imgMaterial.dispose();
            scene.remove(imgPoints);
        }

        const positions = new Float32Array(points.length * 3);
        const colors = new Float32Array(points.length * 3);
        originalColors = colorData;

        for(let i=0; i<points.length; i++) {
            const i3 = i*3;
            positions[i3] = points[i].x;
            positions[i3+1] = points[i].y;
            positions[i3+2] = points[i].z;
            applyBrightnessToParticle(i, colors);
        }

        imgGeometry = new THREE.BufferGeometry();
        imgGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        imgGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        imgMaterial = new THREE.PointsMaterial({
            size: parseFloat(document.getElementById('pSizeRange').value),
            sizeAttenuation: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true
        });

        imgPoints = new THREE.Points(imgGeometry, imgMaterial);
        scene.add(imgPoints);
    }
    
    function applyBrightnessToParticle(index, colorArray) {
        const base = originalColors[index];
        const boost = parseFloat(document.getElementById('brightnessRange').value) / 10;
        const i3 = index * 3;
        colorArray[i3] = base.r * boost;
        colorArray[i3+1] = base.g * boost;
        colorArray[i3+2] = base.b * boost;
    }

    window.updateColors = function() {
        if(!imgGeometry) return;
        const colorAttr = imgGeometry.attributes.color.array;
        for(let i=0; i<originalColors.length; i++) {
            applyBrightnessToParticle(i, colorAttr);
        }
        imgGeometry.attributes.color.needsUpdate = true;
    };

    window.updateMaterial = function() {
        if(imgMaterial) imgMaterial.size = parseFloat(document.getElementById('pSizeRange').value);
    };

    window.updateGalaxy = function() {
        parameters.insideColor = document.getElementById('colorInside').value;
        parameters.outsideColor = document.getElementById('colorOutside').value;
        generateGalaxy();
    };

    // --- 5. 循环 ---
    generateGalaxy();
    
    // 强制移除加载页（成功加载）
    loadingEl.style.opacity = 0;
    setTimeout(() => { loadingEl.remove(); uiEl.style.display = 'block'; }, 500);

    const clock = new THREE.Clock();

    function tick() {
        const elapsedTime = clock.getElapsedTime();

        if(galaxyPoints) galaxyPoints.rotation.y = elapsedTime * 0.05;
        
        if(imgPoints) {
            imgPoints.quaternion.copy(camera.quaternion);
            const height = parseFloat(document.getElementById('textHeight').value);
            imgPoints.position.y = height + Math.sin(elapsedTime * 0.5) * 0.2;
        }

        controls.update();
        composer.render();
        requestAnimationFrame(tick);
    }
    tick();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('keydown', (e) => {
        if(e.key.toLowerCase() === 'h') uiEl.style.opacity = uiEl.style.opacity === '0' ? '1' : '0';
    });

    document.getElementById('btnGen').addEventListener('click', () => {
        const file = document.getElementById('imageInput').files[0];
        if(!file) return alert("请选择图片");
        
        const reader = new FileReader();
        if(file.type.includes('svg')) {
            reader.readAsText(file);
            reader.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            reader.readAsDataURL(file);
            reader.onload = e => processSource(e.target.result);
        }
    });

</script>
</body>
</html>
