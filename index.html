<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani - Eternal Stable</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; user-select: none; }
        
        /* UI 面板 */
        #ui {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(12, 10, 8, 0.95);
            border: 1px solid rgba(255,180,0,0.3);
            border-radius: 12px;
            padding: 15px; color: #fff; z-index: 100;
            box-shadow: 0 10px 60px rgba(0,0,0,0.9);
            max-height: 90vh; overflow-y: auto;
            display: none; /* 默认隐藏 */
        }
        
        #ui::-webkit-scrollbar { width: 4px; }
        #ui::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

        h3 { 
            margin: 0 0 12px 0; color: #ffb700; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,183,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
        }

        .control { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #ccc; margin-bottom: 4px; }
        
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ffb700; height: 3px; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }
        input[type="color"] { width: 100%; height: 25px; border: none; padding: 0; background: none; cursor: pointer; }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 4px;
            background: linear-gradient(135deg, #ffb700, #ff6f00);
            color: #000; font-weight: bold; cursor: pointer;
            margin-top: 5px; font-size: 12px;
        }
        .btn:hover { filter: brightness(1.2); }

        .hint { font-size: 9px; color: #666; text-align: center; margin-top: 10px; }
        
        /* 加载页 */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #ffb700;
            font-size: 12px; letter-spacing: 2px; transition: opacity 0.5s;
        }
        #log-output { 
            color: #444; margin-top: 10px; font-size: 10px; 
            max-width: 90%; text-align: center; font-family: monospace; 
        }
        #force-btn {
            margin-top: 20px; padding: 10px 20px; border: 1px solid #f00; 
            color: #f00; background: transparent; cursor: pointer; display: none;
        }
        #force-btn:hover { background: #200; }
    </style>
    
    <!-- 1. 显式定义 Import Map (使用 jsdelivr 最快源) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="loading">
    <div>CONNECTING TO UNIVERSE...</div>
    <div id="log-output">Initializing...</div>
    <button id="force-btn" onclick="forceStart()">⚠️ 强制进入系统</button>
</div>

<div id="ui">
    <div id="btnClose" style="position:absolute; top:10px; right:15px; cursor:pointer; color:#666;">×</div>

    <h3>GALAXY CONTROL</h3>
    
    <div class="control">
        <label>UPLOAD / 上传法相</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
        <button class="btn" id="btnGen">ACTIVATE / 显现</button>
    </div>

    <!-- 法相参数 -->
    <div class="control">
        <label>SIZE / 大小</label>
        <input type="range" id="imgScale" min="0.5" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="control">
        <label>HEIGHT / 高度</label>
        <input type="range" id="textHeight" min="-5" max="10" value="2" step="0.5">
    </div>
    <div class="control">
        <label>SOLIDITY / 填充度 (消黑点)</label>
        <input type="range" id="pSizeRange" min="0.05" max="0.30" step="0.01" value="0.12">
    </div>
    <div class="control">
        <label>BRIGHTNESS / 亮度</label>
        <input type="range" id="brightnessRange" min="5" max="30" value="10">
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;"></div>

    <!-- 星系参数 -->
    <div class="control">
        <label>GALAXY SIZE / 扩散范围</label>
        <input type="range" id="galRadius" min="10" max="80" value="30">
    </div>
    <div class="control">
        <label>GALAXY THICKNESS / 中间厚度</label>
        <input type="range" id="galThick" min="0" max="50" value="25">
    </div>
    <div class="control">
        <label>GALAXY MIST / 雾化程度</label>
        <input type="range" id="galRandom" min="0" max="30" value="5">
    </div>
    <div class="control">
        <label>GALAXY TWIST / 旋绕形状</label>
        <input type="range" id="galSpin" min="0" max="50" value="10">
    </div>

    <div class="control">
        <label>CORE COLOR / 核心色</label>
        <input type="color" id="colorInside" value="#ff6030">
    </div>
    <div class="control">
        <label>EDGE COLOR / 边缘色</label>
        <input type="color" id="colorOutside" value="#1b3984">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏界面</div>
</div>

<script>
    // --- 2. 预加载日志系统 ---
    const logEl = document.getElementById('log-output');
    function log(msg) {
        logEl.innerHTML += "<br>" + msg;
        console.log(msg);
    }
    window.onerror = function(msg) { log("❌ ERROR: " + msg); };

    // 强制启动逻辑
    function forceStart() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
    }

    // 3秒后如果还没进去，显示强制按钮
    setTimeout(() => {
        if(document.getElementById('loading').style.opacity !== '0') {
            document.getElementById('force-btn').style.display = 'block';
            log("⚠️ 网络较慢，可尝试点击上方红色按钮...");
        }
    }, 3000);
</script>

<script type="module">
    log("📥 Loading Three.js...");
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    log("✅ Engine Loaded.");

    // --- 3. 场景初始化 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = -0.5;

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.15;
    bloomPass.strength = 0.6;
    bloomPass.radius = 0.5;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- 4. 变量定义 ---
    let galaxyPoints = null;
    let galaxyGeometry = null;
    let galaxyMaterial = null;

    let imgPoints = null;
    let imgGeometry = null;
    let imgMaterial = null;
    let cachedImg = null;
    let originalColors = [];

    const parameters = {
        count: 60000, 
        radius: 30,
        branches: 3,
        spin: 1,
        randomness: 0.5,
        randomnessPower: 3,
        thickness: 2.5, 
        insideColor: '#ff6030',
        outsideColor: '#1b3984',
        
        imgScale: 1.0,
        imgHeight: 2.0,
        brightness: 1.0,
        pSize: 0.12
    };

    // --- 5. 星系生成 (修复版) ---
    function generateGalaxy() {
        if (galaxyPoints !== null) {
            galaxyGeometry.dispose();
            galaxyMaterial.dispose();
            scene.remove(galaxyPoints);
        }

        galaxyGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(parameters.count * 3);
        const colors = new Float32Array(parameters.count * 3);

        const colorInside = new THREE.Color(parameters.insideColor);
        const colorOutside = new THREE.Color(parameters.outsideColor);

        for (let i = 0; i < parameters.count; i++) {
            const i3 = i * 3;
            const radius = Math.random() * parameters.radius;
            
            const spinAngle = -radius * parameters.spin; 
            const branchAngle = (i % parameters.branches) / parameters.branches * Math.PI * 2;

            const randomX = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
            
            let thicknessFalloff = 1 - (radius / parameters.radius);
            thicknessFalloff = Math.max(0, Math.pow(thicknessFalloff, 1.5));
            const randomY = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.thickness * thicknessFalloff * 2.0; 
            
            const randomZ = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;

            positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
            positions[i3 + 1] = randomY; 
            positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

            const mixedColor = colorInside.clone();
            mixedColor.lerp(colorOutside, radius / parameters.radius);

            colors[i3] = mixedColor.r; colors[i3 + 1] = mixedColor.g; colors[i3 + 2] = mixedColor.b;
        }

        galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        galaxyMaterial = new THREE.PointsMaterial({
            size: 0.04, sizeAttenuation: true, depthWrite: false,
            blending: THREE.AdditiveBlending, vertexColors: true
        });

        galaxyPoints = new THREE.Points(galaxyGeometry, galaxyMaterial);
        scene.add(galaxyPoints);
    }

    // --- 6. 影像引擎 ---
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="2000" height="2000" ');
        }
        return svg;
    }

    function processSource(src) {
        log("📷 Reading Image...");
        const img = new Image();
        img.onload = () => {
            cachedImg = img;
            processSourceWithCache();
        };
        img.onerror = () => alert("Image Load Failed");
        img.src = src;
    }

    window.processSourceWithCache = function() {
        if (!cachedImg) return;
        const w = 800; const h = 800; 
        const canvas2d = document.createElement('canvas');
        canvas2d.width = w; canvas2d.height = h;
        const ctx2d = canvas2d.getContext('2d');
        ctx2d.clearRect(0, 0, w, h);
        const aspect = cachedImg.width / cachedImg.height || 1;
        let dw = w, dh = w/aspect;
        if(dh > h) { dh = h; dw = h*aspect; }
        ctx2d.drawImage(cachedImg, (w-dw)/2, (h-dh)/2, dw, dh);
        
        const data = ctx2d.getImageData(0,0,w,h).data;
        const points = [];
        const colors = [];
        const gap = 1; 
        const jitter = 0.9;

        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                if (a > 30) {
                    const jx = (Math.random()-0.5) * jitter;
                    const jy = (Math.random()-0.5) * jitter;
                    points.push({
                        x: (x + jx - w/2) / (w/30), 
                        y: -(y + jy - h/2) / (w/30), 
                        z: (Math.random() - 0.5) * 0.1 
                    });
                    colors.push({ r: r/255, g: g/255, b: b/255 });
                }
            }
        }
        if(points.length > 0) createImgParticles(points, colors);
        else alert("Image Empty!");
    };

    function createImgParticles(points, colorData) {
        if (imgPoints !== null) {
            imgGeometry.dispose();
            imgMaterial.dispose();
            scene.remove(imgPoints);
        }
        const positions = new Float32Array(points.length * 3);
        const colors = new Float32Array(points.length * 3);
        originalColors = colorData;

        for(let i=0; i<points.length; i++) {
            const i3 = i*3;
            positions[i3] = points[i].x; positions[i3+1] = points[i].y; positions[i3+2] = points[i].z;
            applyBrightnessToParticle(i, colors);
        }

        imgGeometry = new THREE.BufferGeometry();
        imgGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        imgGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        imgMaterial = new THREE.PointsMaterial({
            size: parameters.pSize, sizeAttenuation: true, depthWrite: true,
            blending: THREE.NormalBlending, vertexColors: true, transparent: true, opacity: 1.0 
        });

        imgPoints = new THREE.Points(imgGeometry, imgMaterial);
        scene.add(imgPoints);
        log("✨ Particles Created: " + points.length);
    }
    
    function applyBrightnessToParticle(index, colorArray) {
        const base = originalColors[index];
        const boost = parameters.brightness / 10;
        const i3 = index * 3;
        colorArray[i3] = Math.min(1, base.r * boost);
        colorArray[i3+1] = Math.min(1, base.g * boost);
        colorArray[i3+2] = Math.min(1, base.b * boost);
    }

    // --- 7. 主动轮询 UI ---
    function checkUI() {
        const getVal = (id) => { const el = document.getElementById(id); return el ? parseFloat(el.value) : 0; };
        const getCol = (id) => { const el = document.getElementById(id); return el ? el.value : '#ffffff'; };

        const r = getVal('galRadius') || 30;
        const mist = getVal('galRandom') / 10;
        const spin = getVal('galSpin') / 10;
        const thick = getVal('galThick') / 10;
        const cIn = getCol('colorInside');
        const cOut = getCol('colorOutside');

        let needsGalaxyUpdate = false;
        if (r !== parameters.radius || mist !== parameters.randomness || spin !== parameters.spin || 
            thick !== parameters.thickness || cIn !== parameters.insideColor || cOut !== parameters.outsideColor) {
            parameters.radius = r; parameters.randomness = mist; parameters.spin = spin;
            parameters.thickness = thick; parameters.insideColor = cIn; parameters.outsideColor = cOut;
            needsGalaxyUpdate = true;
        }

        const pSize = getVal('pSizeRange');
        const bright = getVal('brightnessRange');
        parameters.imgScale = getVal('imgScale');
        parameters.imgHeight = getVal('textHeight');

        let needsMatUpdate = false;
        let needsColorUpdate = false;
        
        if (pSize !== parameters.pSize) { parameters.pSize = pSize; needsMatUpdate = true; }
        if (bright !== parameters.brightness) { parameters.brightness = bright; needsColorUpdate = true; }

        if (needsGalaxyUpdate) generateGalaxy();
        if (imgMaterial && needsMatUpdate) imgMaterial.size = parameters.pSize;
        if (imgGeometry && needsColorUpdate) {
            const colorAttr = imgGeometry.attributes.color.array;
            for(let i=0; i<originalColors.length; i++) applyBrightnessToParticle(i, colorAttr);
            imgGeometry.attributes.color.needsUpdate = true;
        }
    }

    // 绑定
    document.getElementById('btnGen').onclick = () => {
        const file = document.getElementById('imageInput').files[0];
        if(!file) return alert("请选择图片");
        const reader = new FileReader();
        if(file.type.includes('svg')) {
            reader.readAsText(file);
            reader.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            reader.readAsDataURL(file);
            reader.onload = e => processSource(e.target.result);
        }
    };
    document.getElementById('btnClose').onclick = () => document.getElementById('ui').style.opacity = '0';
    window.onkeydown = (e) => { if(e.key.toLowerCase() === 'h') document.getElementById('ui').style.opacity = document.getElementById('ui').style.opacity==='0'?'1':'0'; };

    // --- 8. 启动 ---
    log("🚀 Launching Galaxy...");
    generateGalaxy();
    
    // 成功加载后移除 Loading
    document.getElementById('loading').style.opacity = 0;
    setTimeout(() => {
        const load = document.getElementById('loading');
        if(load) load.remove();
        document.getElementById('ui').style.display = 'block';
    }, 500);

    const clock = new THREE.Clock();

    function tick() {
        checkUI(); 
        const elapsedTime = clock.getElapsedTime();
        if(galaxyPoints) galaxyPoints.rotation.y = -elapsedTime * 0.05;
        if(imgPoints) {
            imgPoints.quaternion.copy(camera.quaternion);
            imgPoints.position.y = parameters.imgHeight + Math.sin(elapsedTime * 0.5) * 0.2;
            imgPoints.scale.setScalar(parameters.imgScale);
        }
        controls.update();
        composer.render();
        requestAnimationFrame(tick);
    }
    tick();
    
    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    };

</script>
</body>
</html>
