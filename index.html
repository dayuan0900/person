<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani - 3D Real Model Final</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; user-select: none; }
        
        #ui {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(12, 10, 8, 0.9);
            border: 1px solid rgba(255,180,0,0.3);
            border-radius: 12px;
            padding: 15px; color: #fff; z-index: 100;
            box-shadow: 0 10px 60px rgba(0,0,0,0.9);
            max-height: 90vh; overflow-y: auto;
        }
        #ui::-webkit-scrollbar { width: 4px; }
        #ui::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

        h3 { 
            margin: 0 0 12px 0; color: #ffb700; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
        }

        .control { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #ccc; margin-bottom: 4px; }
        
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ffb700; height: 3px; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }
        input[type="color"] { width: 100%; height: 25px; border: none; padding: 0; background: none; cursor: pointer; }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 4px;
            background: linear-gradient(135deg, #ffb700, #ff6f00);
            color: #000; font-weight: bold; cursor: pointer;
            margin-top: 5px; font-size: 12px;
        }
        .btn:hover { filter: brightness(1.2); }

        .hint { font-size: 9px; color: #666; text-align: center; margin-top: 10px; }
        
        /* 进度条加载遮罩 */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #ffb700;
            transition: opacity 0.5s;
        }
        
        .loading-text { font-size: 12px; letter-spacing: 2px; margin-bottom: 15px; }
        
        /* 进度条容器 */
        .progress-container {
            width: 200px; height: 4px; background: #333; border-radius: 2px; overflow: hidden;
        }
        /* 进度条本体 */
        .progress-bar {
            width: 0%; height: 100%; background: #00eaff; 
            box-shadow: 0 0 10px #00eaff; transition: width 0.1s;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="loading">
    <div class="loading-text" id="loadText">INITIALIZING ENGINE...</div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>

<div id="ui">
    <div id="btnClose" style="position:absolute; top:10px; right:15px; cursor:pointer; color:#666;">×</div>

    <h3>3D MODEL LOADER</h3>
    
    <div class="control">
        <label>UPLOAD MODEL / 上传模型 (.glb)</label>
        <input type="file" id="modelInput" accept=".glb,.gltf">
        <button class="btn" id="btnGen">ACTIVATE / 显现</button>
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;"></div>

    <!-- 模型参数 -->
    <div class="control">
        <label>MODEL SCALE / 模型大小</label>
        <input type="range" id="modScale" min="0.1" max="10.0" step="0.1" value="1.0">
    </div>
    <div class="control">
        <label>MODEL HEIGHT / 悬浮高度</label>
        <input type="range" id="modHeight" min="-10" max="10" value="0" step="0.5">
    </div>
    <div class="control">
        <label>PARTICLE SIZE / 粒子粗细</label>
        <input type="range" id="pSizeRange" min="0.01" max="0.2" step="0.01" value="0.03">
    </div>
    <div class="control">
        <label>MODEL COLOR / 法身颜色</label>
        <input type="color" id="modColor" value="#ffd700">
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;"></div>

    <!-- 星系参数 -->
    <div class="control">
        <label>GALAXY SIZE / 星系大小</label>
        <input type="range" id="galRadius" min="10" max="80" value="30">
    </div>
    <div class="control">
        <label>GALAXY MIST / 星系雾化</label>
        <input type="range" id="galRandom" min="0" max="30" value="5">
    </div>

    <div class="hint">左键旋转 | 右键平移 | 滚轮缩放<br>支持 GLB / GLTF 格式</div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- UI 工具 ---
    const loadScreen = document.getElementById('loading');
    const loadText = document.getElementById('loadText');
    const progressBar = document.getElementById('progressBar');

    function updateLoading(percent, text) {
        loadScreen.style.display = 'flex';
        loadScreen.style.opacity = 1;
        progressBar.style.width = percent + '%';
        if(text) loadText.innerText = text;
    }

    function hideLoading() {
        loadText.innerText = "COMPLETE";
        progressBar.style.width = '100%';
        setTimeout(() => {
            loadScreen.style.opacity = 0;
            setTimeout(() => loadScreen.style.display = 'none', 500);
        }, 500);
    }

    // --- 1. 场景初始化 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = -0.5;

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0; bloomPass.strength = 0.8; bloomPass.radius = 0.5;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- 2. 变量 ---
    let galaxyPoints = null;
    let modelPoints = null;
    let modelGeometry = null;
    let modelMaterial = null;

    const params = {
        galRadius: 30, galRandom: 0.5, galSpin: 1,
        modScale: 1.0, modHeight: 0, pSize: 0.03, modColor: '#ffd700'
    };

    // --- 3. 星系生成 ---
    function generateGalaxy() {
        if (galaxyPoints) { scene.remove(galaxyPoints); galaxyPoints.geometry.dispose(); galaxyPoints.material.dispose(); }

        const count = 60000;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);
        const cIn = new THREE.Color('#ff6030');
        const cOut = new THREE.Color('#1b3984');

        for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            const r = Math.random() * params.galRadius;
            const spinAngle = -r * params.galSpin; 
            const branchAngle = (i % 3) / 3 * Math.PI * 2;
            const rnd = params.galRandom;

            const rx = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * rnd * r;
            const ry = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * rnd * r * 0.5;
            const rz = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * rnd * r;

            pos[i3] = Math.cos(branchAngle + spinAngle) * r + rx;
            pos[i3+1] = ry; 
            pos[i3+2] = Math.sin(branchAngle + spinAngle) * r + rz;

            const mixedColor = cIn.clone().lerp(cOut, r / params.galRadius);
            col[i3] = mixedColor.r; col[i3+1] = mixedColor.g; col[i3+2] = mixedColor.b;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

        const mat = new THREE.PointsMaterial({
            size: 0.04, sizeAttenuation: true, depthWrite: false,
            blending: THREE.AdditiveBlending, vertexColors: true
        });

        galaxyPoints = new THREE.Points(geo, mat);
        scene.add(galaxyPoints);
    }

    // --- 4. 3D模型引擎 (GLB/GLTF + 进度条) ---
    function loadModel(url) {
        updateLoading(0, "CONNECTING...");

        const loader = new GLTFLoader();
        
        loader.load(url, 
            // 1. 加载成功回调
            (gltf) => {
                updateLoading(100, "PROCESSING GEOMETRY...");
                
                // 稍微延迟一点，让UI有机会渲染100%
                setTimeout(() => {
                    const positions = [];
                    gltf.scene.traverse((child) => {
                        if (child.isMesh) {
                            const geo = child.geometry;
                            if(!geo.attributes.position) return;
                            const posAttribute = geo.attributes.position;
                            
                            // 读取顶点
                            for(let i=0; i<posAttribute.count; i++) {
                                const v = new THREE.Vector3();
                                v.fromBufferAttribute(posAttribute, i);
                                v.applyMatrix4(child.matrixWorld);
                                positions.push(v.x, v.y, v.z);
                            }
                        }
                    });

                    if(positions.length === 0) {
                        alert("模型中没有检测到网格(Mesh)数据！");
                        hideLoading();
                        return;
                    }

                    createModelParticles(positions);
                    hideLoading();
                }, 100);
            }, 
            
            // 2. 进度回调 (Progress)
            (xhr) => {
                if (xhr.lengthComputable) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    updateLoading(percent, `DOWNLOADING MODEL ${percent}%`);
                } else {
                    updateLoading(50, "READING STREAM..."); // 无法计算大小时
                }
            }, 
            
            // 3. 错误回调
            (error) => {
                console.error(error);
                alert("模型解析失败，请检查文件格式");
                hideLoading();
            }
        );
    }

    function createModelParticles(posArray) {
        if(modelPoints) { scene.remove(modelPoints); modelGeometry.dispose(); modelMaterial.dispose(); }

        modelGeometry = new THREE.BufferGeometry();
        modelGeometry.setAttribute('position', new THREE.Float32BufferAttribute(posArray, 3));
        
        // 自动居中
        modelGeometry.computeBoundingBox();
        const center = new THREE.Vector3();
        modelGeometry.boundingBox.getCenter(center);
        modelGeometry.center(); 

        modelMaterial = new THREE.PointsMaterial({
            size: params.pSize,
            color: new THREE.Color(params.modColor),
            sizeAttenuation: true,
            depthWrite: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8
        });

        modelPoints = new THREE.Points(modelGeometry, modelMaterial);
        
        // 自动缩放
        const size = modelGeometry.boundingBox.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const autoScale = 10 / maxDim; // 目标大小 10
        
        params.modScale = autoScale; 
        document.getElementById('modScale').value = autoScale;
        
        modelPoints.scale.setScalar(autoScale);
        scene.add(modelPoints);
    }

    // --- 5. 事件绑定 ---
    function updateParams() {
        params.galRadius = parseFloat(document.getElementById('galRadius').value);
        params.galRandom = parseFloat(document.getElementById('galRandom').value) / 10;
        
        params.modScale = parseFloat(document.getElementById('modScale').value);
        params.modHeight = parseFloat(document.getElementById('modHeight').value);
        params.pSize = parseFloat(document.getElementById('pSizeRange').value);
        params.modColor = document.getElementById('modColor').value;
        
        if(modelMaterial) {
            modelMaterial.size = params.pSize;
            modelMaterial.color.set(params.modColor);
        }
        if(modelPoints) {
            modelPoints.scale.setScalar(params.modScale);
            modelPoints.position.y = params.modHeight;
        }
    }

    document.getElementById('btnGen').onclick = () => {
        const file = document.getElementById('modelInput').files[0];
        if(!file) return alert("请选择 .glb 或 .gltf 文件");
        const url = URL.createObjectURL(file);
        loadModel(url);
    };

    // 绑定滑块
    document.getElementById('galRadius').addEventListener('input', () => { updateParams(); generateGalaxy(); });
    document.getElementById('galRandom').addEventListener('input', () => { updateParams(); generateGalaxy(); });
    
    document.getElementById('modScale').addEventListener('input', updateParams);
    document.getElementById('modHeight').addEventListener('input', updateParams);
    document.getElementById('pSizeRange').addEventListener('input', updateParams);
    document.getElementById('modColor').addEventListener('input', updateParams);

    document.getElementById('btnClose').onclick = () => document.getElementById('ui').style.opacity = '0';
    window.onkeydown = (e) => { if(e.key.toLowerCase() === 'h') document.getElementById('ui').style.opacity = document.getElementById('ui').style.opacity==='0'?'1':'0'; };

    // --- 6. 循环 ---
    generateGalaxy();
    hideLoading();

    const clock = new THREE.Clock();
    function tick() {
        const dt = clock.getElapsedTime();
        if(galaxyPoints) galaxyPoints.rotation.y = -dt * 0.05;
        controls.update();
        composer.render();
        requestAnimationFrame(tick);
    }
    tick();

    window.onresize = () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    };

</script>
</body>
</html>
