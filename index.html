<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani - Digital Thangka</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        #ui {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(15, 10, 8, 0.9);
            border: 1px solid rgba(255,180,0,0.2);
            border-radius: 12px;
            padding: 15px; color: #fff; z-index: 100;
            box-shadow: 0 10px 60px rgba(0,0,0,0.9);
        }

        h3 { 
            margin: 0 0 12px 0; color: #ffb700; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,183,0,0.3);
        }

        .btn {
            width: 100%; padding: 10px; border: none; border-radius: 4px;
            background: linear-gradient(135deg, #ffb700, #ff6f00);
            color: #000; font-weight: bold; cursor: pointer;
            margin-top: 5px; font-size: 12px;
        }
        .btn:hover { filter: brightness(1.1); }

        .control { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #ccc; margin-bottom: 4px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ffb700; height: 3px; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }
        input[type="color"] { width: 100%; height: 25px; border: none; padding: 0; background: none; }

        .hint { font-size: 9px; color: #666; text-align: center; margin-top: 8px; }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex;
            justify-content: center; align-items: center; color: #ffb700;
            font-size: 12px; letter-spacing: 2px; transition: opacity 0.5s;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="loading">INITIALIZING THANGKA ENGINE...</div>

<div id="ui">
    <div onclick="document.getElementById('ui').style.opacity='0'" style="position:absolute; top:10px; right:15px; cursor:pointer; color:#666;">×</div>

    <h3>DIGITAL THANGKA</h3>
    
    <div class="control">
        <label>UPLOAD / 上传法相 (PNG)</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
        <button class="btn" id="btnGen">ACTIVATE / 显现</button>
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:12px 0;"></div>

    <div class="control">
        <label>SOLIDITY / 填充度 (消灭黑点)</label>
        <!-- 粒子大小范围调大，允许重叠 -->
        <input type="range" id="pSizeRange" min="0.05" max="0.30" step="0.01" value="0.12" oninput="updateMaterial()">
    </div>

    <div class="control">
        <label>DETAIL / 清晰度</label>
        <input type="range" id="densityRange" min="1" max="5" step="1" value="3" oninput="processSourceWithCache()">
    </div>

    <div class="control">
        <label>BRIGHTNESS / 亮度 (自然还原)</label>
        <input type="range" id="brightnessRange" min="5" max="30" value="10" oninput="updateColors()">
    </div>

    <div class="control">
        <label>HEIGHT / 悬浮高度</label>
        <input type="range" id="textHeight" min="-5" max="10" value="2" step="0.5">
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:12px 0;"></div>

    <div class="control">
        <label>GALAXY / 星系颜色</label>
        <input type="color" id="colorInside" value="#ff6030" oninput="updateGalaxy()">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏界面</div>
</div>

<script type="module" data-cfasync="false">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- 1. 场景初始化 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    // 光晕 (Bloom) - 星系发光，人物微光
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.2; // 只有很亮的地方才发光
    bloomPass.strength = 0.5;  // 强度适中
    bloomPass.radius = 0.5;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- 2. 变量 ---
    let galaxyPoints = null;
    let imgPoints = null;
    let imgGeometry = null;
    let imgMaterial = null;
    
    let cachedImg = null;
    let originalColors = [];

    const parameters = {
        count: 60000, 
        radius: 30,
        branches: 3,
        insideColor: '#ff6030',
        outsideColor: '#1b3984'
    };

    // --- 3. 星系背景 (保持发光模式) ---
    function generateGalaxy() {
        if (galaxyPoints) {
            scene.remove(galaxyPoints);
            galaxyPoints.geometry.dispose();
            galaxyPoints.material.dispose();
        }

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(parameters.count * 3);
        const colors = new Float32Array(parameters.count * 3);
        const cIn = new THREE.Color(parameters.insideColor);
        const cOut = new THREE.Color(parameters.outsideColor);

        for (let i = 0; i < parameters.count; i++) {
            const i3 = i * 3;
            const r = Math.random() * parameters.radius;
            const spin = r * 1;
            const branch = (i % parameters.branches) / parameters.branches * Math.PI * 2;
            
            const randomX = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * 0.2 * r;
            const randomY = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * 0.2 * r;
            const randomZ = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * 0.2 * r;

            positions[i3] = Math.cos(branch + spin) * r + randomX;
            positions[i3+1] = randomY * 1.5;
            positions[i3+2] = Math.sin(branch + spin) * r + randomZ;

            const mixedColor = cIn.clone();
            mixedColor.lerp(cOut, r / parameters.radius);
            colors[i3] = mixedColor.r; colors[i3+1] = mixedColor.g; colors[i3+2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.04,
            sizeAttenuation: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending, // 星系依然是发光叠加
            vertexColors: true
        });

        galaxyPoints = new THREE.Points(geometry, material);
        scene.add(galaxyPoints);
    }

    // --- 4. 庄严法相引擎 (Solid Mode) ---
    
    function processSource(src) {
        const img = new Image();
        img.onload = () => {
            cachedImg = img;
            processSourceWithCache();
        };
        img.onerror = () => alert("加载失败");
        img.src = src;
    }

    window.processSourceWithCache = function() {
        if (!cachedImg) return;
        
        const density = parseInt(document.getElementById('densityRange').value);
        const w = 400 + (density * 150); 
        const h = w; 

        const canvas2d = document.createElement('canvas');
        canvas2d.width = w; canvas2d.height = h;
        const ctx2d = canvas2d.getContext('2d');
        
        ctx2d.clearRect(0, 0, w, h);
        
        const aspect = cachedImg.width / cachedImg.height || 1;
        let dw = w, dh = w/aspect;
        if(dh > h) { dh = h; dw = h*aspect; }
        
        ctx2d.drawImage(cachedImg, (w-dw)/2, (h-dh)/2, dw, dh);
        
        const data = ctx2d.getImageData(0,0,w,h).data;
        const points = [];
        const colors = [];
        const gap = 1; 

        // 随机填缝 (Jitter)
        const jitter = 0.9;

        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                
                if (a > 30) {
                    // 加入随机抖动，打破网格感
                    const jx = (Math.random()-0.5) * jitter;
                    const jy = (Math.random()-0.5) * jitter;
                    
                    points.push({
                        x: (x + jx - w/2) / (w/30), 
                        y: -(y + jy - h/2) / (w/30), 
                        z: (Math.random() - 0.5) * 0.1 
                    });
                    colors.push({ r: r/255, g: g/255, b: b/255 });
                }
            }
        }
        
        if(points.length > 0) createImgParticles(points, colors);
        else alert("无内容！");
    };

    function createImgParticles(points, colorData) {
        if (imgPoints !== null) {
            imgGeometry.dispose();
            imgMaterial.dispose();
            scene.remove(imgPoints);
        }

        const positions = new Float32Array(points.length * 3);
        const colors = new Float32Array(points.length * 3);
        originalColors = colorData;

        for(let i=0; i<points.length; i++) {
            const i3 = i*3;
            positions[i3] = points[i].x;
            positions[i3+1] = points[i].y;
            positions[i3+2] = points[i].z;
            applyBrightnessToParticle(i, colors);
        }

        imgGeometry = new THREE.BufferGeometry();
        imgGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        imgGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // 【核心修改】使用 NormalBlending (正常混合)
        // 这样粒子叠加不会变白，而是像颜料一样覆盖
        imgMaterial = new THREE.PointsMaterial({
            size: parseFloat(document.getElementById('pSizeRange').value),
            sizeAttenuation: true,
            depthWrite: true, // 开启深度写入，让前面的粒子遮挡后面的
            blending: THREE.NormalBlending, 
            vertexColors: true,
            transparent: true,
            opacity: 1.0 // 不透明，保证色彩还原
        });

        imgPoints = new THREE.Points(imgGeometry, imgMaterial);
        scene.add(imgPoints);
    }
    
    function applyBrightnessToParticle(index, colorArray) {
        const base = originalColors[index];
        const boost = parseFloat(document.getElementById('brightnessRange').value) / 10;
        const i3 = index * 3;
        // 简单亮度增益，不改变色相
        colorArray[i3] = Math.min(1, base.r * boost);
        colorArray[i3+1] = Math.min(1, base.g * boost);
        colorArray[i3+2] = Math.min(1, base.b * boost);
    }

    window.updateColors = function() {
        if(!imgGeometry) return;
        const colorAttr = imgGeometry.attributes.color.array;
        for(let i=0; i<originalColors.length; i++) {
            applyBrightnessToParticle(i, colorAttr);
        }
        imgGeometry.attributes.color.needsUpdate = true;
    };

    window.updateMaterial = function() {
        if(imgMaterial) imgMaterial.size = parseFloat(document.getElementById('pSizeRange').value);
    };

    window.updateGalaxy = function() {
        parameters.insideColor = document.getElementById('colorInside').value;
        parameters.outsideColor = document.getElementById('colorOutside').value;
        generateGalaxy();
    };

    // --- 5. 循环 ---
    generateGalaxy();
    document.getElementById('loading').style.opacity = 0;
    setTimeout(() => document.getElementById('loading').remove(), 500);

    const clock = new THREE.Clock();

    function tick() {
        const elapsedTime = clock.getElapsedTime();

        if(galaxyPoints) galaxyPoints.rotation.y = elapsedTime * 0.05;
        
        if(imgPoints) {
            imgPoints.quaternion.copy(camera.quaternion);
            const height = parseFloat(document.getElementById('textHeight').value);
            imgPoints.position.y = height + Math.sin(elapsedTime * 0.5) * 0.2;
        }

        controls.update();
        composer.render();
        requestAnimationFrame(tick);
    }
    tick();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('keydown', (e) => {
        if(e.key.toLowerCase() === 'h') {
            document.getElementById('ui').style.opacity = document.getElementById('ui').style.opacity === '0' ? '1' : '0';
        }
    });

    document.getElementById('btnGen').addEventListener('click', () => {
        const file = document.getElementById('imageInput').files[0];
        if(!file) return alert("请选择图片");
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = e => processSource(e.target.result);
    });

</script>
</body>
</html>
