<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani - System Monitor</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; user-select: none; }
        
        /* 监控台：显示当前指令 */
        #monitor {
            position: absolute; top: 10px; left: 10px; width: 280px;
            background: rgba(20, 0, 0, 0.9); /* 红色背景，显眼 */
            border: 1px solid #f00; color: #f00;
            padding: 10px; font-size: 11px; z-index: 200;
            pointer-events: none;
        }
        .mon-val { color: #fff; font-weight: bold; }

        #ui {
            position: absolute; top: 80px; left: 10px; width: 280px;
            background: rgba(15, 15, 20, 0.95);
            border: 1px solid #444; border-radius: 8px;
            padding: 15px; color: #fff; z-index: 100;
            max-height: 80vh; overflow-y: auto;
        }

        .control { margin-bottom: 12px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        label { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 4px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #00e5ff; }
        input[type="color"] { width: 100%; height: 25px; border: none; cursor: pointer; }
        input[type="file"] { width: 100%; font-size: 10px; }

        .btn {
            width: 100%; padding: 10px; background: #00e5ff; color: #000;
            border: none; font-weight: bold; cursor: pointer; margin-top: 5px;
        }
    </style>
    
    <!-- 使用最稳的 esm.sh 源 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<!-- 监控面板 -->
<div id="monitor">
    <div>SYSTEM: <span id="m-status" class="mon-val">INIT...</span></div>
    <div>ACTION: <span id="m-action" class="mon-val">WAITING</span></div>
    <div>VALUE: <span id="m-value" class="mon-val">--</span></div>
</div>

<div id="ui">
    <div class="control">
        <label>1. UPLOAD IMAGE</label>
        <input type="file" id="inpFile" accept="image/*,.svg">
        <button class="btn" id="btnRun">ACTIVATE / 显现</button>
    </div>

    <!-- 星系控制 -->
    <div class="control">
        <label>GALAXY SIZE / 扩散范围</label>
        <input type="range" id="slRadius" min="10" max="100" value="30">
    </div>
    <div class="control">
        <label>GALAXY MIST / 雾化程度</label>
        <input type="range" id="slMist" min="0" max="20" value="5">
    </div>
    <div class="control">
        <label>GALAXY TWIST / 旋绕形状</label>
        <input type="range" id="slTwist" min="0" max="50" value="10">
    </div>
    <div class="control">
        <label>CORE COLOR / 核心色</label>
        <input type="color" id="colCore" value="#ff6030">
    </div>
    <div class="control">
        <label>EDGE COLOR / 边缘色</label>
        <input type="color" id="colEdge" value="#1b3984">
    </div>

    <!-- 图像控制 -->
    <div class="control">
        <label>IMG SIZE / 大小</label>
        <input type="range" id="slScale" min="0.5" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="control">
        <label>IMG HEIGHT / 高度</label>
        <input type="range" id="slHeight" min="-5" max="10" step="0.5" value="2.0">
    </div>
    <div class="control">
        <label>BRIGHTNESS / 亮度</label>
        <input type="range" id="slBright" min="5" max="30" value="10">
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- 监控系统 ---
    const mStatus = document.getElementById('m-status');
    const mAction = document.getElementById('m-action');
    const mValue = document.getElementById('m-value');

    function log(action, val) {
        mAction.innerText = action;
        mValue.innerText = val;
        console.log(action, val);
    }

    // --- 1. 场景 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 30);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloom.threshold = 0.1; bloom.strength = 0.6; bloom.radius = 0.5;
    composer.addPass(bloom);

    // --- 2. 状态 ---
    let galaxySystem = null;
    let imgSystem = null;
    let cachedImg = null;
    let originalColors = [];

    const params = {
        radius: 30,
        mist: 0.5,
        twist: 1.0,
        cIn: '#ff6030',
        cOut: '#1b3984',
        
        imgScale: 1.0,
        imgHeight: 2.0,
        brightness: 1.0
    };

    // --- 3. 核心功能：星系生成 ---
    function createGalaxy() {
        if(galaxySystem) {
            scene.remove(galaxySystem);
            galaxySystem.geometry.dispose();
            galaxySystem.material.dispose();
        }

        const count = 60000;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);
        
        const colorIn = new THREE.Color(params.cIn);
        const colorOut = new THREE.Color(params.cOut);

        for(let i=0; i<count; i++) {
            const i3 = i*3;
            const r = Math.random() * params.radius;
            
            // 旋绕 + 雾化公式
            const spin = r * params.twist * 0.1;
            const branch = (i % 3) / 3 * Math.PI * 2;
            
            const rndX = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * params.mist * r * 0.1;
            const rndY = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * params.mist * r * 0.1;
            const rndZ = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * params.mist * r * 0.1;

            pos[i3] = Math.cos(branch + spin) * r + rndX;
            pos[i3+1] = rndY * 1.5;
            pos[i3+2] = Math.sin(branch + spin) * r + rndZ;

            const mixColor = colorIn.clone().lerp(colorOut, r / params.radius);
            col[i3] = mixColor.r; col[i3+1] = mixColor.g; col[i3+2] = mixColor.b;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        
        const mat = new THREE.PointsMaterial({
            size: 0.05, sizeAttenuation: true, depthWrite: false,
            blending: THREE.AdditiveBlending, vertexColors: true
        });

        galaxySystem = new THREE.Points(geo, mat);
        scene.add(galaxySystem);
    }

    // --- 4. 图像处理 (灰底法) ---
    function loadImg(src) {
        log("LOADING", "IMAGE...");
        const img = new Image();
        img.onload = () => {
            cachedImg = img;
            processImg();
        };
        img.onerror = () => log("ERROR", "LOAD FAILED");
        img.src = src;
    }

    function processImg() {
        if(!cachedImg) return;
        
        // 采样
        const w = 800; const h = 800;
        const cvs = document.createElement('canvas');
        cvs.width = w; cvs.height = h;
        const c2d = cvs.getContext('2d');
        c2d.fillStyle = '#808080';
        c2d.fillRect(0,0,w,h);
        
        const asp = cachedImg.width/cachedImg.height||1;
        let dw=w, dh=w/asp; if(dh>h){ dh=h; dw=h*asp; }
        c2d.drawImage(cachedImg, (w-dw)/2, (h-dh)/2, dw, dh);
        
        const data = c2d.getImageData(0,0,w,h).data;
        const pts = []; const cols = [];
        const gap = 1; const jitter = 0.8;

        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const r=data[i], g=data[i+1], b=data[i+2];
                // 灰度差异检测
                if(Math.abs((r+g+b)/3 - 128) > 20) {
                    const jx = (Math.random()-0.5)*jitter;
                    const jy = (Math.random()-0.5)*jitter;
                    pts.push((x+jx-w/2)/(w/30), -(y+jy-h/2)/(w/30), (Math.random()-0.5)*0.1);
                    cols.push(r/255, g/255, b/255);
                }
            }
        }
        
        buildImgPoints(pts, cols);
        log("GENERATED", pts.length/3 + " PTS");
    }

    function buildImgPoints(pts, cols) {
        if(imgSystem) { scene.remove(imgSystem); imgSystem.geometry.dispose(); }
        
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
        
        originalColors = cols; // 备份颜色
        
        const mat = new THREE.PointsMaterial({
            size: 0.04, sizeAttenuation: true, depthWrite: true,
            blending: THREE.NormalBlending, vertexColors: true,
            transparent: true, opacity: 1.0
        });
        
        imgSystem = new THREE.Points(geo, mat);
        scene.add(imgSystem);
        updateImgColors(); // 应用初始亮度
    }

    function updateImgColors() {
        if(!imgSystem) return;
        const attr = imgSystem.geometry.attributes.color.array;
        const boost = params.brightness;
        for(let i=0; i<originalColors.length; i++) {
            attr[i] = Math.min(1, originalColors[i] * boost);
        }
        imgSystem.geometry.attributes.color.needsUpdate = true;
    }

    // --- 5. 暴力绑定事件 (The Fix) ---
    // 不再使用 HTML oninput，直接 JS 监听
    
    // 星系滑块
    document.getElementById('slRadius').addEventListener('input', (e) => {
        params.radius = parseFloat(e.target.value);
        log("RADIUS", params.radius);
        createGalaxy();
    });
    document.getElementById('slMist').addEventListener('input', (e) => {
        params.mist = parseFloat(e.target.value) / 10; // 0-2
        log("MIST", params.mist);
        createGalaxy();
    });
    document.getElementById('slTwist').addEventListener('input', (e) => {
        params.twist = parseFloat(e.target.value) / 10;
        log("TWIST", params.twist);
        createGalaxy();
    });
    document.getElementById('colCore').addEventListener('input', (e) => {
        params.cIn = e.target.value;
        log("CORE", params.cIn);
        createGalaxy();
    });
    document.getElementById('colEdge').addEventListener('input', (e) => {
        params.cOut = e.target.value;
        log("EDGE", params.cOut);
        createGalaxy();
    });

    // 图像滑块
    document.getElementById('slScale').addEventListener('input', (e) => {
        params.imgScale = parseFloat(e.target.value);
        log("SCALE", params.imgScale);
    });
    document.getElementById('slHeight').addEventListener('input', (e) => {
        params.imgHeight = parseFloat(e.target.value);
        log("HEIGHT", params.imgHeight);
    });
    document.getElementById('slBright').addEventListener('input', (e) => {
        params.brightness = parseFloat(e.target.value) / 10;
        log("BRIGHT", params.brightness);
        updateImgColors();
    });

    // 按钮
    document.getElementById('btnRun').addEventListener('click', () => {
        const file = document.getElementById('inpFile').files[0];
        if(!file) return alert("Select Image!");
        const reader = new FileReader();
        if(file.type.includes('svg')) {
            reader.readAsText(file);
            reader.onload = e => {
                let svg = e.target.result;
                if(!svg.includes('width=')) svg = svg.replace('<svg', '<svg width="1000" height="1000" ');
                const blob = new Blob([svg], {type:'image/svg+xml'});
                loadImg(URL.createObjectURL(blob));
            }
        } else {
            reader.readAsDataURL(file);
            reader.onload = e => loadImg(e.target.result);
        }
    });

    // --- 6. 启动 ---
    createGalaxy();
    mStatus.innerText = "RUNNING";
    mStatus.style.color = "#0f0";

    const clock = new THREE.Clock();
    function animate() {
        const dt = clock.getElapsedTime();
        
        if(galaxySystem) galaxySystem.rotation.y = dt * 0.05;
        
        if(imgSystem) {
            imgSystem.quaternion.copy(camera.quaternion);
            imgSystem.position.y = params.imgHeight + Math.sin(dt*0.5)*0.2;
            imgSystem.scale.setScalar(params.imgScale);
        }

        controls.update();
        composer.render();
        requestAnimationFrame(animate);
    }
    animate();
    
    window.onresize = () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    };

</script>
</body>
</html>
