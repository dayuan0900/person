<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani - Galaxy Shaper</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        #ui {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(15, 12, 10, 0.9);
            border: 1px solid rgba(255,180,0,0.2);
            border-radius: 12px;
            padding: 15px; color: #fff; z-index: 100;
            box-shadow: 0 10px 60px rgba(0,0,0,0.9);
            max-height: 90vh; overflow-y: auto;
        }
        
        /* 隐藏滚动条 */
        #ui::-webkit-scrollbar { width: 4px; }
        #ui::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

        h3 { 
            margin: 0 0 12px 0; color: #ffb700; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,183,0,0.3);
        }

        .btn {
            width: 100%; padding: 10px; border: none; border-radius: 4px;
            background: linear-gradient(135deg, #ffb700, #ff6f00);
            color: #000; font-weight: bold; cursor: pointer;
            margin-top: 5px; font-size: 12px;
        }
        .btn:hover { filter: brightness(1.1); }

        .control { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #ccc; margin-bottom: 4px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ffb700; height: 3px; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }
        input[type="color"] { width: 100%; height: 25px; border: none; padding: 0; background: none; }

        .hint { font-size: 9px; color: #666; text-align: center; margin-top: 8px; }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex;
            justify-content: center; align-items: center; color: #ffb700;
            font-size: 12px; letter-spacing: 2px; transition: opacity 0.5s;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="loading">INITIALIZING ENGINE...</div>

<div id="ui">
    <div onclick="document.getElementById('ui').style.opacity='0'" style="position:absolute; top:10px; right:15px; cursor:pointer; color:#666;">×</div>

    <h3>DIGITAL THANGKA</h3>
    
    <div class="control">
        <label>UPLOAD / 上传法相 (PNG)</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
        <button class="btn" id="btnGen">ACTIVATE / 显现</button>
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:12px 0;"></div>

    <!-- 法相控制 -->
    <div class="control">
        <label>SIZE / 法相大小</label>
        <input type="range" id="imgScale" min="0.5" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="control">
        <label>HEIGHT / 悬浮高度</label>
        <input type="range" id="textHeight" min="-5" max="10" value="2" step="0.5">
    </div>
    <div class="control">
        <label>SOLIDITY / 填充度 (消灭黑点)</label>
        <input type="range" id="pSizeRange" min="0.05" max="0.30" step="0.01" value="0.12" oninput="updateMaterial()">
    </div>
    <div class="control">
        <label>BRIGHTNESS / 亮度</label>
        <input type="range" id="brightnessRange" min="5" max="30" value="10" oninput="updateColors()">
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:12px 0;"></div>

    <!-- 星云控制 (新增) -->
    <div class="control">
        <label>GALAXY EXPAND / 星云扩散范围</label>
        <input type="range" id="galRadius" min="10" max="60" value="30" oninput="updateGalaxyParams()">
    </div>
    
    <div class="control">
        <label>GALAXY MIST / 星云雾化 (形状松散度)</label>
        <input type="range" id="galRandom" min="0" max="20" value="5" oninput="updateGalaxyParams()">
    </div>

    <div class="control">
        <label>GALAXY TWIST / 星云旋绕 (形状)</label>
        <input type="range" id="galSpin" min="0" max="50" value="10" oninput="updateGalaxyParams()">
    </div>

    <div class="control">
        <label>GALAXY COLOR / 星云颜色</label>
        <input type="color" id="colorInside" value="#ff6030" oninput="updateGalaxyParams()">
        <input type="color" id="colorOutside" value="#1b3984" style="margin-top:5px;" oninput="updateGalaxyParams()">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏界面</div>
</div>

<script type="module" data-cfasync="false">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- 1. 场景初始化 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.2;
    bloomPass.strength = 0.6;
    bloomPass.radius = 0.5;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- 2. 变量 ---
    let galaxyPoints = null;
    let imgPoints = null;
    let imgGeometry = null;
    let imgMaterial = null;
    let cachedImg = null;
    let originalColors = [];

    // 星系参数
    const parameters = {
        count: 80000, 
        radius: 30,
        branches: 3,
        spin: 1,
        randomness: 0.5,
        randomnessPower: 3,
        insideColor: '#ff6030',
        outsideColor: '#1b3984'
    };

    // --- 3. 星系生成 (动态重绘) ---
    function generateGalaxy() {
        if (galaxyPoints) {
            scene.remove(galaxyPoints);
            galaxyPoints.geometry.dispose();
            galaxyPoints.material.dispose();
        }

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(parameters.count * 3);
        const colors = new Float32Array(parameters.count * 3);
        const cIn = new THREE.Color(parameters.insideColor);
        const cOut = new THREE.Color(parameters.outsideColor);

        for (let i = 0; i < parameters.count; i++) {
            const i3 = i * 3;
            const r = Math.random() * parameters.radius;
            
            // 旋绕逻辑
            const spinAngle = r * parameters.spin;
            const branchAngle = (i % parameters.branches) / parameters.branches * Math.PI * 2;
            
            // 雾化/扩散逻辑 (randomness)
            const randomX = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random()<0.5?1:-1) * parameters.randomness * r;
            const randomY = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random()<0.5?1:-1) * parameters.randomness * r;
            const randomZ = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random()<0.5?1:-1) * parameters.randomness * r;

            positions[i3] = Math.cos(branchAngle + spinAngle) * r + randomX;
            positions[i3+1] = randomY * 1.
