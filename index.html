<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani - Galaxy Control Fix</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', monospace; user-select: none; 
        }

        #ui {
            position: absolute; top: 20px; left: 20px; width: 290px;
            background: rgba(12, 12, 18, 0.95);
            border: 1px solid rgba(255,180,0,0.3);
            border-radius: 12px;
            padding: 20px; color: #fff; z-index: 100;
            box-shadow: 0 10px 60px rgba(0,0,0,0.9);
            max-height: 90vh; overflow-y: auto;
        }
        
        #ui::-webkit-scrollbar { width: 4px; }
        #ui::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

        h3 { 
            margin: 0 0 15px 0; color: #ffb700; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,183,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
        }

        .control { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 11px; color: #bbb; margin-bottom: 5px; }
        /* 数值显示 */
        .val-disp { color: #00e5ff; font-weight: bold; }

        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ffb700; height: 4px; border-radius: 2px; }
        input[type="file"] { width: 100%; font-size: 11px; color: #888; }
        input[type="color"] { width: 100%; height: 28px; border: none; padding: 0; background: none; cursor: pointer; }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 4px;
            background: linear-gradient(135deg, #ffb700, #ff6f00);
            color: #000; font-weight: bold; cursor: pointer;
            margin-top: 5px;
        }
        .btn:hover { filter: brightness(1.1); }

        .hint { font-size: 10px; color: #666; text-align: center; margin-top: 10px; }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex;
            justify-content: center; align-items: center; color: #ffb700;
            font-size: 12px; letter-spacing: 2px; transition: opacity 0.5s;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="loading">INITIALIZING...</div>

<div id="ui">
    <div id="btnClose" style="position:absolute; top:10px; right:15px; cursor:pointer; color:#666;">×</div>

    <h3>GALAXY CONTROLLER</h3>
    
    <div class="control">
        <label>UPLOAD / 上传法相</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
        <button class="btn" id="btnGen">ACTIVATE / 显现</button>
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;"></div>

    <!-- 法相控制 -->
    <div class="control">
        <label>SIZE / 大小 <span id="v-scale" class="val-disp">1.0</span></label>
        <input type="range" id="imgScale" min="0.5" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="control">
        <label>HEIGHT / 高度 <span id="v-height" class="val-disp">2.0</span></label>
        <input type="range" id="textHeight" min="-5" max="10" value="2" step="0.5">
    </div>
    <div class="control">
        <label>SOLIDITY / 填充度 <span id="v-solid" class="val-disp">0.12</span></label>
        <input type="range" id="pSizeRange" min="0.05" max="0.30" step="0.01" value="0.12">
    </div>
    <div class="control">
        <label>BRIGHTNESS / 亮度 <span id="v-bright" class="val-disp">10</span></label>
        <input type="range" id="brightnessRange" min="5" max="30" value="10">
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;"></div>

    <!-- 星云控制 (关键修复区) -->
    <div class="control">
        <label>GALAXY SIZE / 扩散 <span id="v-gr" class="val-disp">30</span></label>
        <input type="range" id="galRadius" min="10" max="80" value="30">
    </div>
    
    <div class="control">
        <label>GALAXY MIST / 雾化 <span id="v-gm" class="val-disp">5</span></label>
        <input type="range" id="galRandom" min="0" max="30" value="5">
    </div>

    <div class="control">
        <label>GALAXY TWIST / 旋绕 <span id="v-gs" class="val-disp">10</span></label>
        <input type="range" id="galSpin" min="0" max="50" value="10">
    </div>

    <div class="control">
        <label>CORE COLOR / 核心色</label>
        <input type="color" id="colorInside" value="#ff6030">
    </div>
    <div class="control">
        <label>EDGE COLOR / 边缘色</label>
        <input type="color" id="colorOutside" value="#1b3984">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏界面</div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- 1. 场景初始化 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.2;
    bloomPass.strength = 0.5;
    bloomPass.radius = 0.5;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- 2. 变量 ---
    let galaxyPoints = null;
    let imgPoints = null;
    let imgGeometry = null;
    let imgMaterial = null;
    let cachedImg = null;
    let originalColors = [];

    const parameters = {
        count: 60000, 
        radius: 30,
        branches: 3,
        spin: 1,
        randomness: 0.5,
        randomnessPower: 3,
        insideColor: '#ff6030',
        outsideColor: '#1b3984'
    };

    // --- 3. 星系生成 (核心逻辑) ---
    function generateGalaxy() {
        if (galaxyPoints !== null) {
            galaxyGeometry.dispose();
            galaxyMaterial.dispose();
            scene.remove(galaxyPoints);
        }

        const galaxyGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(parameters.count * 3);
        const colors = new Float32Array(parameters.count * 3);

        const colorInside = new THREE.Color(parameters.insideColor);
        const colorOutside = new THREE.Color(parameters.outsideColor);

        for (let i = 0; i < parameters.count; i++) {
            const i3 = i * 3;
            const radius = Math.random() * parameters.radius;
            
            const spinAngle = radius * parameters.spin;
            const branchAngle = (i % parameters.branches) / parameters.branches * Math.PI * 2;

            const randomX = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
            const randomY = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
            const randomZ = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;

            positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
            positions[i3 + 1] = randomY * 1.5; 
            positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

            const mixedColor = colorInside.clone();
            mixedColor.lerp(colorOutside, radius / parameters.radius);

            colors[i3] = mixedColor.r; colors[i3 + 1] = mixedColor.g; colors[i3 + 2] = mixedColor.b;
        }

        galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const galaxyMaterial = new THREE.PointsMaterial({
            size: 0.04,
            sizeAttenuation: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true
        });

        galaxyPoints = new THREE.Points(galaxyGeometry, galaxyMaterial);
        scene.add(galaxyPoints);
    }

    // --- 4. 影像引擎 ---
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="2000" height="2000" ');
        }
        return svg;
    }

    function processSource(src) {
        const img = new Image();
        img.onload = () => {
            cachedImg = img;
            processSourceWithCache();
        };
        img.onerror = () => alert("加载失败");
        img.src = src;
    }

    window.processSourceWithCache = function() {
        if (!cachedImg) return;
        const w = 600; const h = 600; 
        const canvas2d = document.createElement('canvas');
        canvas2d.width = w; canvas2d.height = h;
        const ctx2d = canvas2d.getContext('2d');
        
        ctx2d.clearRect(0, 0, w, h);
        const aspect = cachedImg.width / cachedImg.height || 1;
        let dw = w, dh = w/aspect;
        if(dh > h) { dh = h; dw = h*aspect; }
        ctx2d.drawImage(cachedImg, (w-dw)/2, (h-dh)/2, dw, dh);
        
        const data = ctx2d.getImageData(0,0,w,h).data;
        const points = [];
        const colors = [];
        const gap = 1; 
        const jitter = 0.9;

        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                if (a > 30) {
                    const jx = (Math.random()-0.5) * jitter;
                    const jy = (Math.random()-0.5) * jitter;
                    points.push({
                        x: (x + jx - w/2) / (w/30), 
                        y: -(y + jy - h/2) / (w/30), 
                        z: (Math.random() - 0.5) * 0.1 
                    });
                    colors.push({ r: r/255, g: g/255, b: b/255 });
                }
            }
        }
        if(points.length > 0) createImgParticles(points, colors);
        else alert("无内容！");
    };

    function createImgParticles(points, colorData) {
        if (imgPoints !== null) {
            imgGeometry.dispose();
            imgMaterial.dispose();
            scene.remove(imgPoints);
        }
        const positions = new Float32Array(points.length * 3);
        const colors = new Float32Array(points.length * 3);
        originalColors = colorData;

        for(let i=0; i<points.length; i++) {
            const i3 = i*3;
            positions[i3] = points[i].x;
            positions[i3+1] = points[i].y;
            positions[i3+2] = points[i].z;
            applyBrightnessToParticle(i, colors);
        }

        imgGeometry = new THREE.BufferGeometry();
        imgGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        imgGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        imgMaterial = new THREE.PointsMaterial({
            size: parseFloat(document.getElementById('pSizeRange').value),
            sizeAttenuation: true,
            depthWrite: true,
            blending: THREE.NormalBlending, 
            vertexColors: true,
            transparent: true,
            opacity: 1.0 
        });

        imgPoints = new THREE.Points(imgGeometry, imgMaterial);
        scene.add(imgPoints);
    }
    
    function applyBrightnessToParticle(index, colorArray) {
        const base = originalColors[index];
        const boost = parseFloat(document.getElementById('brightnessRange').value) / 10;
        const i3 = index * 3;
        colorArray[i3] = Math.min(1, base.r * boost);
        colorArray[i3+1] = Math.min(1, base.g * boost);
        colorArray[i3+2] = Math.min(1, base.b * boost);
    }

    // --- 5. 绑定逻辑 (最安全的方式) ---
    function setupEvents() {
        // 辅助函数：更新显示数值
        const updateVal = (id, val) => {
            const el = document.getElementById('v-' + id);
            if(el) el.innerText = val;
        };

        // 星系参数更新
        function updateGalaxy() {
            parameters.radius = parseFloat(document.getElementById('galRadius').value);
            parameters.randomness = parseFloat(document.getElementById('galRandom').value) / 10;
            parameters.spin = parseFloat(document.getElementById('galSpin').value) / 10;
            parameters.insideColor = document.getElementById('colorInside').value;
            parameters.outsideColor = document.getElementById('colorOutside').value;
            generateGalaxy();
        }

        // 绑定星系滑块
        document.getElementById('galRadius').oninput = function() { updateVal('gr', this.value); updateGalaxy(); };
        document.getElementById('galRandom').oninput = function() { updateVal('gm', this.value); updateGalaxy(); };
        document.getElementById('galSpin').oninput = function() { updateVal('gs', this.value); updateGalaxy(); };
        document.getElementById('colorInside').oninput = updateGalaxy;
        document.getElementById('colorOutside').oninput = updateGalaxy;

        // 绑定法相滑块
        document.getElementById('imgScale').oninput = function() { updateVal('scale', this.value); };
        document.getElementById('textHeight').oninput = function() { updateVal('height', this.value); };
        
        document.getElementById('pSizeRange').oninput = function() {
            updateVal('solid', this.value);
            if(imgMaterial) imgMaterial.size = parseFloat(this.value);
        };

        document.getElementById('brightnessRange').oninput = function() {
            updateVal('bright', this.value);
            if(!imgGeometry) return;
            const colorAttr = imgGeometry.attributes.color.array;
            for(let i=0; i<originalColors.length; i++) applyBrightnessToParticle(i, colorAttr);
            imgGeometry.attributes.color.needsUpdate = true;
        };

        // 按钮
        document.getElementById('btnGen').onclick = () => {
            const file = document.getElementById('imageInput').files[0];
            if(!file) return alert("请选择图片");
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => processSource(e.target.result);
        };

        document.getElementById('btnClose').onclick = () => {
            document.getElementById('ui').style.opacity = '0';
        };

        window.onkeydown = (e) => {
            if(e.key.toLowerCase() === 'h') {
                const ui = document.getElementById('ui');
                ui.style.opacity = ui.style.opacity === '0' ? '1' : '0';
            }
        };
    }

    // --- 6. 启动 ---
    // 确保DOM加载后再绑定
    window.onload = function() {
        setupEvents();
        generateGalaxy();
        document.getElementById('loading').style.opacity = 0;
        setTimeout(() => document.getElementById('loading').remove(), 500);
        animate();
    };

    const clock = new THREE.Clock();

    function animate() {
        const elapsedTime = clock.getElapsedTime();

        if(galaxyPoints) galaxyPoints.rotation.y = elapsedTime * 0.05;
        
        if(imgPoints) {
            imgPoints.quaternion.copy(camera.quaternion);
            const height = parseFloat(document.getElementById('textHeight').value);
            const scale = parseFloat(document.getElementById('imgScale').value);
            imgPoints.position.y = height + Math.sin(elapsedTime * 0.5) * 0.2;
            imgPoints.scale.set(scale, scale, scale);
        }

        controls.update();
        composer.render();
        requestAnimationFrame(animate);
    }

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    };

</script>
</body>
</html>
